# docker-compose.demo.yml — simplified single-container IDS demo
#
# Usage:
#   docker compose -f docker-compose.demo.yml up demo       # terminal demo
#   docker compose -f docker-compose.demo.yml up dashboard  # web dashboard on :8501
#
# No network configuration needed. No multi-container setup.
# Just one container that does everything.

version: "3.9"

services:

  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: ciciot2023-demo
    command: ["python", "demo.py"]
    volumes:
      # Mount your trained models so the container can use them
      - ./models:/app/models:ro
      - ./reports:/app/reports
      - ./demo_results.json:/app/demo_results.json
    environment:
      - PYTHONPATH=/app

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: ciciot2023-dashboard
    command: ["streamlit", "run", "demo_dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports
    environment:
      - PYTHONPATH=/app
    profiles: ["dashboard"]   # opt-in: docker compose --profile dashboard up
