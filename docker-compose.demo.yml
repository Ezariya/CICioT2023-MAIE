version: "3.8"

# docker-compose.demo.yml — simplified portable IDS demo
# Usage:
#   docker compose -f docker-compose.demo.yml up            # Launches web dashboard on :8501
#   docker compose -f docker-compose.demo.yml run demo      # Launches terminal demo

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: ciciot2023-ids-demo:latest
    container_name: ciciot2023-soc-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: ciciot2023-ids-demo:latest
    container_name: ciciot2023-terminal-demo
    command: ["python", "demo.py", "--benchmark"]
    environment:
      - PYTHONUNBUFFERED=1
